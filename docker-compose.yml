services:
  db:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # env_file은 두지 않습니다. .env가 없는 환경(새로 clone한 저장소·CI)에서는 파일이
    # 없다는 이유만으로 docker compose config가 즉시 실패하기 때문입니다. 루트 .env는
    # compose가 ${VAR} 보간용으로 자동으로 읽으므로, 아래처럼 필요한 키만 명시해도
    # .env에 적어 둔 값이 그대로 컨테이너까지 전달됩니다.
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4000}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      # 아래는 값이 없으면 앱 기본값과 같은 값을 넣습니다. 빈 문자열을 넘기지 않으므로
      # 컨테이너 안에서도 로컬 실행과 동일하게 동작합니다.
      - GAME_DEV_MIN_PLAYERS=${GAME_DEV_MIN_PLAYERS:-1}
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - DB_POOL_MIN=${DB_POOL_MIN:-0}
      - DB_POOL_IDLE=${DB_POOL_IDLE:-10000}
      - DB_POOL_ACQUIRE=${DB_POOL_ACQUIRE:-30000}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mysql_data: