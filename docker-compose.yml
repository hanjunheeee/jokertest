services:
  db:
    image: mysql:8.4
    # 죽으면 docker가 바로 다시 켬 (손으로 docker stop 한 것만 안 켬)
    restart: unless-stopped
    # docker 로그 크기 제한 (파일 10MB × 5개까지만, 디스크 꽉 차는 것 막기)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # 서버 자기 자신(127.0.0.1)에서만 접속 → 바깥 IP로 MySQL 못 두드림 (DP-016)
    # 로컬 개발 PC에서 localhost:3306 접속은 그대로 됨
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 환경값은 파일 통째로 넘김 (DP-004): 로컬은 루트 .env, 운영은 .env.production (뒤 파일이 이김)
    # required: false → 파일이 없어도 compose가 안 깨짐 (새로 clone한 저장소·CI). compose 2.24 이상
    # 키 목록은 backend/.env.example (소셜 로그인·메일·HMAC·토스·INTERNAL_API_KEY·LOG_* 다 포함)
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    # 아래는 컨테이너 안에서 늘 같아야 하는 값만 (environment가 env_file보다 이김)
    # 나머지 키를 여기 ${VAR}로 다시 적으면 env_file 값을 빈 값으로 덮을 수 있어 안 적음
    environment:
      # 값 없으면 production (빈 글자는 서버가 시작 거부)
      - NODE_ENV=${NODE_ENV:-production}
      # nginx가 backend:4000으로 보냄 → .env의 PORT와 상관없이 4000
      - PORT=4000
      # 로그 파일은 아래 backend_logs 볼륨(/app/logs)에 날짜별로
      - LOG_DIR=/app/logs
    volumes:
      - backend_logs:/app/logs
    # 죽으면 바로 다시 켬, /health가 3번 연속 실패하면 unhealthy 표시
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://127.0.0.1:\"+(process.env.PORT||4000)+\"/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 종료 신호 뒤 정리(점검 안내·DB 닫기) 기다리는 시간
    stop_grace_period: 15s
    # docker 로그 크기 제한 (파일 10MB × 5개까지만, 디스크 꽉 차는 것 막기)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4000"

  # 데스크톱·모바일 화면 + API·소켓 프록시 (nginx 하나, nginx/default.conf)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # 빌드 때 화면에 박히는 값 (DP-002). 운영은 --env-file .env.production 으로 넘김
      # 기본값은 로컬 docker용 (api.localhost:8080 → 같은 nginx의 API 자리)
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api.localhost:8080}
        VITE_DISCORD_SUPPORT_URL: ${VITE_DISCORD_SUPPORT_URL:-}
        VITE_AD_PROVIDER: ${VITE_AD_PROVIDER:-}
        VITE_ADSENSE_CLIENT: ${VITE_ADSENSE_CLIENT:-}
        VITE_ADSENSE_SLOT_BANNER: ${VITE_ADSENSE_SLOT_BANNER:-}
        VITE_ADSENSE_SLOT_INTERSTITIAL: ${VITE_ADSENSE_SLOT_INTERSTITIAL:-}
    restart: unless-stopped
    depends_on:
      - backend
    # 로컬은 8080 하나, 운영 80·443은 docker-compose.prod.yml
    ports:
      - "${WEB_PORT:-8080}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  mysql_data:
  backend_logs: