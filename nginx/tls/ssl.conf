# 운영 HTTPS 조각: default.conf의 server마다 include로 들어감 (docker-compose.prod.yml이 붙임)
# 인증서 하나에 도메인 4개(example.com·www·m·api)를 같이 받는 기준, example.com 자리는 실제 도메인으로

listen 443 ssl;
http2 on;

# 인증서 둘 중 하나 (클라우드플레어 SSL 모드 Full (strict)는 둘 다 받음, docs/배포_설정.md 6장)
# ① Let's Encrypt (certbot이 서버 /etc/letsencrypt에 받음, 90일마다 갱신)
ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
# ② Cloudflare Origin CA (클라우드플레어만 믿는 원본 인증서, 15년·갱신 없음): ① 두 줄 지우고 아래 두 줄 켜기
#    서버의 nginx/tls/ 폴더에 origin.pem·origin.key로 두기 (git엔 안 올라감, nginx/tls/.gitignore)
# ssl_certificate     /etc/nginx/tls/origin.pem;
# ssl_certificate_key /etc/nginx/tls/origin.key;
ssl_protocols TLSv1.2 TLSv1.3;

# http로 오면 같은 주소 https로 (쿠키가 Secure라 http면 로그인이 안 됨, DP-008)
# 인증서 갱신 확인도 https로 따라와서 괜찮음
if ($scheme = http) {
  return 301 https://$host$request_uri;
}
