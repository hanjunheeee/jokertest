# MMC nginx 설정: 데스크톱·모바일 화면 두 사이트 + API·소켓 프록시를 컨테이너 하나에서
# 도메인 example.com 자리는 실제 도메인으로 바꾸기 (데스크톱 example.com · 모바일 m.example.com · API api.example.com · 관리자 admin.example.com)
#
# - 이 파일은 80 포트만 엶 → 로컬 docker compose에서 인증서 없이 그대로 켜짐
#   (로컬 주소: 데스크톱 localhost:8080 · 모바일 m.localhost:8080 · API api.localhost:8080 · 관리자 admin.localhost:8080)
# - 운영은 docker-compose.prod.yml이 nginx/tls/ 를 /etc/nginx/tls 에 붙임 → 아래 server마다
#   include 한 줄로 443·인증서·http→https 돌리기가 같이 켜짐 (파일 없으면 include는 아무것도 안 함)
# - 쓰는 법: docs/배포_설정.md

# 폰 userAgent 가려내기 (태블릿·데스크톱은 0 → 데스크톱 화면 그대로)
# 안드로이드 폰은 "Android ... Mobile", 안드로이드 태블릿은 Mobile 없음
map $http_user_agent $is_phone {
  default 0;
  "~*(iphone|ipod|android.+mobile|windows phone|iemobile|blackberry|opera mini)" 1;
}

# 응답 머리말·오류 화면에 nginx 버전 안 보이기 (보안 점검 2026-11-09)
server_tokens off;

# https 요청일 때만 HSTS 값 (snippets/security-headers.conf가 씀, http면 빈 값 → 헤더 안 붙음)
map $scheme $hsts_value {
  https "max-age=31536000; includeSubDomains";
  default "";
}

# Node 여러 개: 백엔드 묶음(upstream)과 ?node= 고르기 map (생성 파일, deploy/scripts/gen-nodes.js)
# 아래 API 사이트가 proxy_pass http://$mmc_upstream; 으로 보냄 → ?node=<SERVER_ID>면 그 Node(죽었으면 다른 Node), 아니면 덜 바쁜 Node
# 저장소 기본은 Node 1개(backend:4000), 운영은 remote.sh가 NODE_COUNT로 다시 만들고 compose가 폴더째 붙임
include /etc/nginx/snippets/mmc-upstreams.conf;

# 소켓 업그레이드 요청이면 upgrade, 아니면 close
map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

# 로그인 앞단 요청 제한: IP 하나에 1분 10번 (코드 쪽 로그인 제한이 아직 없음, DP-013)
# 클라우드플레어 뒤에선 snippets/cloudflare-realip.conf가 $remote_addr를 진짜 사용자 IP로 바꿔서 사람마다 셈
# (조각 없으면 클라우드플레어 서버 IP 몇 개로 모두 묶여 남의 요청까지 같이 막힘)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
# 관리자 로그인 앞단 제한: 플레이어 로그인과 셈을 따로 (서버 쪽 잠깐 막기와 별개로 마구 두드리기만 끊음)
limit_req_zone $binary_remote_addr zone=admin_login:1m rate=10r/m;

# 글자 파일만 압축 (그림·영상·소리는 이미 압축돼 있어 안 함)
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# 모르는 주소(IP로 바로 접속 등)는 응답 없이 끊기
# 운영 443도 이 server가 첫 번째라 기본 자리가 됨
server {
  listen 80 default_server;
  server_name _;
  include /etc/nginx/tls/*.conf;
  return 444;
}

# www는 앞 없는 주소로 (CORS 허용 주소가 글자 그대로 일치해야 해서, DP-011)
server {
  listen 80;
  server_name www.example.com;
  include /etc/nginx/tls/*.conf;
  return 301 $scheme://example.com$request_uri;
}

# 데스크톱 화면
server {
  listen 80;
  server_name example.com localhost;
  include /etc/nginx/tls/*.conf;
  # 클라우드플레어 뒤 진짜 사용자 IP (클라우드플레어 IP에서 온 CF-Connecting-IP만 믿음)
  include /etc/nginx/snippets/cloudflare-realip.conf;

  root /usr/share/nginx/html/desktop;

  # 서버 단계 보안 헤더 (add_header 없는 location이 물려받음)
  include /etc/nginx/snippets/security-headers.conf;

  # 숨김 파일(.env·.git 등)은 화면 index.html로 돌리지 말고 404 (점검 도구가 200을 찾음)
  location ~ /\.(?!well-known/) {
    return 404;
  }

  # 인증서 갱신 확인 파일 (certbot webroot)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  # 새 배포가 바로 보이게 index.html은 늘 다시 확인
  # private: 클라우드플레어 같은 중간 캐시엔 안 남김 (같은 주소가 폰이면 302라 기기마다 응답이 다름)
  location = /index.html {
    add_header Cache-Control "private, no-cache";
    add_header Vary "User-Agent";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # 새 버전 안내용 파일, 캐시 안 함
  location = /version.json {
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # 빌드가 만든 파일은 이름에 해시가 붙음 → 1년 그대로 써도 됨
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # public 그림·영상·소리는 이름에 해시가 없음 → 7일만 (바꿀 땐 파일 이름도 바꾸기)
  location ~* \.(png|jpe?g|webp|gif|svg|ico|mp4|webm|ogg|mp3|wav)$ {
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # 화면 주소: 폰이면 같은 경로·쿼리로 모바일 사이트에 (비번 재설정 링크도 이 길로, DP-021·033)
  # 모바일에도 데스크톱과 같은 경로가 다 있음 (frontend-mobile/src/app/routes/index.jsx)
  # 302는 어디에도 저장 안 함: 클라우드플레어가 폰 302를 저장하면 PC도 m.으로 가 버림
  location / {
    if ($is_phone) {
      add_header Cache-Control "no-store" always;
      add_header Vary "User-Agent" always;
      include /etc/nginx/snippets/security-headers.conf;
      return 302 $scheme://m.$http_host$request_uri;
    }
    try_files $uri /index.html;
  }
}

# 모바일 화면
# 모바일 이미지엔 index.html·version.json·assets만 넣음, public 그림은 데스크톱 폴더 것을 같이 씀
server {
  listen 80;
  server_name m.example.com m.localhost;
  include /etc/nginx/tls/*.conf;
  include /etc/nginx/snippets/cloudflare-realip.conf;

  root /usr/share/nginx/html/mobile;

  # 서버 단계 보안 헤더 (add_header 없는 location이 물려받음)
  include /etc/nginx/snippets/security-headers.conf;

  # 숨김 파일(.env·.git 등)은 화면 index.html로 돌리지 말고 404 (점검 도구가 200을 찾음)
  location ~ /\.(?!well-known/) {
    return 404;
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "private, no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /version.json {
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # public 그림은 데스크톱 폴더에서
  location ~* \.(png|jpe?g|webp|gif|svg|ico|mp4|webm|ogg|mp3|wav)$ {
    root /usr/share/nginx/html/desktop;
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # 모바일 폴더에 없으면 데스크톱 public에서 찾고, 그래도 없으면 모바일 index.html
  location / {
    try_files $uri @desktop_public;
  }

  location @desktop_public {
    root /usr/share/nginx/html/desktop;
    try_files $uri /index.html;
  }
}

# API + 소켓 (백엔드 Node 1개 이상, DP-007 · Node 여러 개는 mmc-upstreams.conf)
server {
  listen 80;
  server_name api.example.com api.localhost;
  include /etc/nginx/tls/*.conf;
  # 아래 요청 제한·/internal 허용 목록·백엔드로 넘기는 IP가 전부 진짜 사용자 IP를 보게
  include /etc/nginx/snippets/cloudflare-realip.conf;

  # 백엔드가 혹시 붙인 서버 이름 헤더는 빼고 보냄
  proxy_hide_header X-Powered-By;

  # 백엔드로 넘기는 X-Forwarded-For는 $remote_addr 하나만 (위 조각이 정한 진짜 사용자 IP)
  # 사람이 넣은 X-Forwarded-For 줄은 버림 → 백엔드 trust proxy 1이 이 값 하나만 읽음

  # 숨김 파일 주소는 백엔드까지 안 보내고 404
  location ~ /\.(?!well-known/) {
    return 404;
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  # 관리자 페이지 서버 경로는 관리자 주소(admin.)에서만 → 여기선 백엔드까지 안 보내고 404
  # 대소문자 안 가림: 백엔드 경로가 대소문자 안 가려서 /ADMIN-API/ 로 돌아 들어오는 것 막기
  location ~* ^/admin-api(/|$) {
    return 404;
  }

  # 관리자 통로는 허용 ip만 (기본 전부 403, 목록은 snippets/internal-allow.conf)
  # 허용 검사도 진짜 사용자 IP 기준 (클라우드플레어를 거쳐도 관리자 IP 그대로 보임)
  # 대소문자 안 가림: 백엔드 경로가 대소문자 안 가려서 /INTERNAL/ 로 돌아 들어오는 것 막기
  location ~* ^/internal(/|$) {
    include /etc/nginx/snippets/internal-allow.conf;
    proxy_pass http://$mmc_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 소켓은 웹소켓만 씀 → Upgrade·Connection 꼭 넘기기 (DP-010)
  # 서버 ping 25초마다(socket.io 기본) → 클라우드플레어 빈 연결 끊기(100초)·아래 120초 둘 다 안 걸림
  location /socket.io/ {
    proxy_pass http://$mmc_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # 로그인만 앞단 제한, 넘치면 429
  location = /auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://$mmc_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://$mmc_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# 관리자 페이지 (화면 dist-admin + /admin-api, 같은 주소라 쿠키·CORS가 안 섞임, docs/배포_설정.md 8장)
# 맨 앞 클라우드플레어 Access가 관리자 이메일 둘만 통과시킴, 서버도 Access 표를 다시 확인
server {
  listen 80;
  server_name admin.example.com admin.localhost;
  include /etc/nginx/tls/*.conf;
  include /etc/nginx/snippets/cloudflare-realip.conf;

  root /usr/share/nginx/html/admin;
  index admin.html;

  # 관리자 전용 보안 머리글 (CSP 더 좁게·검색 안 걸리게)
  # 이 사이트 location은 add_header를 안 씀 → 전부 이 머리글을 물려받음 (캐시는 expires로)
  include /etc/nginx/snippets/admin-security-headers.conf;

  proxy_hide_header X-Powered-By;

  location ~ /\.(?!well-known/) {
    return 404;
  }

  # Let's Encrypt 쓸 때만 필요 (Access에서 이 경로만 통과 규칙, 8장)
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  # 관리자 로그인만 앞단 제한, 넘치면 429
  location ~* ^/admin-api/auth/login$ {
    limit_req zone=admin_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://$mmc_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 관리자 서버 경로: Node 아무 곳 (세션·잠금이 DB 표라 어느 Node든 같음)
  # Cf-Access-Jwt-Assertion 머리글은 nginx가 그대로 넘김 → 서버가 Access 표 확인
  location ~* ^/admin-api(/|$) {
    proxy_pass http://$mmc_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 입구 화면은 늘 다시 확인 (새 배포 바로 보이게)
  location = /admin.html {
    expires -1;
  }

  # 이름에 해시 붙은 빌드 파일 → 1년
  location ^~ /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # 화면 주소(/members 등)는 전부 admin.html
  location / {
    expires -1;
    try_files $uri /admin.html;
  }
}
