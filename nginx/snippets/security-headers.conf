# 화면 응답 보안 헤더 조각: default.conf의 server와 add_header 쓰는 location마다 include
# (nginx는 location에 add_header가 하나라도 있으면 위 단계 add_header를 안 물려받아서 매번 넣음)
# frontend/Dockerfile이 /etc/nginx/snippets/ 에 복사함

# MIME 추측 막기 · 다른 사이트 틀 안에 넣기 막기(클릭재킹) · 주소 새기 줄이기
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 안 쓰는 기기 기능 끔 (결제창이 쓸 수 있는 payment는 안 막음)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=()" always;
# 틀 넣기·플러그인·base 주소 바꾸기만 막는 CSP (스크립트 출처 제한은 광고·결제 도메인 확인 뒤, docs/보안_점검_2026-11-09.md)
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
# https일 때만 HSTS (값이 비면 nginx가 헤더를 안 붙임, $hsts_value는 default.conf 맨 위 map)
add_header Strict-Transport-Security $hsts_value always;
