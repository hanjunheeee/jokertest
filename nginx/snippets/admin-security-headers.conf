# 관리자 페이지 보안 머리글 조각, default.conf의 admin 사이트 server 단계에서 한 번 include
# 플레이어 화면(security-headers.conf)보다 좁게: 광고·결제가 없어 내 주소 것만 허용

# 내 주소 파일만 읽기 · 그림은 data: 까지 · 다른 사이트 틀 안에 넣기·플러그인·base 주소 바꾸기·바깥으로 폼 보내기 막기
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# 검색에 안 걸리게 (주소가 새도 검색으로 못 찾음, admin.html의 robots 태그와 같이)
add_header X-Robots-Tag "noindex, nofollow" always;
# 틀 넣기 막기(옛 브라우저용) · MIME 추측 막기
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# 다른 사이트로 넘어갈 때 관리자 주소(회원 번호 등) 안 넘김
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
# 다른 창(window.opener)과 안 엮이기
add_header Cross-Origin-Opener-Policy "same-origin" always;
# https일 때만 HSTS (값이 비면 헤더 안 붙음, $hsts_value는 default.conf 맨 위 map)
add_header Strict-Transport-Security $hsts_value always;
