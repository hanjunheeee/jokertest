# 관리자 통로(/internal) 허용 ip 목록, nginx/default.conf API 사이트의 /internal 자리가 include함
# 기본은 전부 막음 (공개 API 주소로 관리자 통로가 열려 있던 것 막기, 2026-11-09)
#
# 쓰는 법: 관리자 서버 공인 ip를 deny all; 위에 한 줄씩 (위에서부터 처음 맞는 줄이 먹음)
#   allow <관리자 서버 ip>;
# 바꾼 뒤: 이미지 다시 빌드(--build) 또는 컨테이너 안 파일 바꾸고 nginx -s reload
# 같은 서버 안 docker 망에서 부르면 nginx 안 거치고 http://backend:4000/internal 로 바로 (이 목록 상관없음)

deny all;
