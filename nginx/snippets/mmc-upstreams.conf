# 생성 파일, 손으로 고치지 말고 다시 만들기: node deploy/scripts/gen-nodes.js (docs/배포_설정.md 7장)
# Node 1개 (docker): n1=backend:4000
# default.conf API 사이트가 proxy_pass http://$mmc_upstream; 으로 씀 → 화면이 ?node=<SERVER_ID>를 붙이면 그 Node, 없거나 모르는 값이면 아무 Node

upstream mmc_any {
  least_conn;
  zone mmc_any 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server backend:4000 max_fails=1 fail_timeout=5s resolve;
}

upstream mmc_node_1 {
  zone mmc_node_1 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server backend:4000 max_fails=1 fail_timeout=5s resolve;
}

map $arg_node $mmc_upstream {
  default mmc_any;
  "n1" mmc_node_1;
}
