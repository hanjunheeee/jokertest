# CI/CD (GitLab) — 새 저장소가 GitLab이면 저장소 루트에 .gitlab-ci.yml 로 복사 (docs/CI_CD.md)
# GitHub Actions(deploy/ci/github-actions/*.yml)와 같은 스크립트(deploy/ci/scripts)를 부름 → 할 일이 따로 놀지 않음
# MR: 백엔드·DB·화면 둘·도커·보안 + 브라우저 빠른 묶음 / 일정(Schedules)·손으로(Run pipeline): 브라우저 전체 + Node 2개 브라우저 전체
# 배포: 손으로(▶) 또는 v* 태그 — production은 Settings → CI/CD → Protected environments 승인 걸기

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  # 같은 브랜치 새 push면 이전 파이프라인 취소 (interruptible 일만)
  auto_cancel:
    on_new_commit: interruptible

stages: [test, build, e2e, security, deploy]

variables:
  # CI 안에서만 쓰는 시험 DB root 비번 (진짜 비밀 아님)
  MYSQL_ROOT_PASSWORD: ci-root-test-only
  VITE_API_BASE_URL: http://api.ci.test
  npm_config_cache: $CI_PROJECT_DIR/.npm
  # 손으로 돌릴 때(Run pipeline) 고르는 배포 환경, v* 태그는 production
  DEPLOY_ENV:
    value: staging
    options: [staging, production]
    description: 배포 환경 (손으로 돌릴 때)
  ROLLBACK_TAG:
    value: ""
    description: rollback 때 태그 (비우면 바로 전 태그)
  # 손으로 돌릴 때 브라우저 묶음 (GitHub workflow_dispatch e2e와 같음), 일정은 둘 다 돎
  E2E:
    value: full
    options: [full, multinode, none]
    description: 브라우저 시험 묶음 (손으로 돌릴 때)

default:
  image: node:22-bookworm
  interruptible: true
  cache:
    key: npm-$CI_JOB_NAME
    paths: [.npm/]

# 시험 일 공통: 일정·태그 파이프라인엔 안 돎
.test-rules: &test-rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_COMMIT_TAG
      when: never
    - when: on_success

.mysql: &mysql
  services:
    - name: mysql:8.4
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: ci-root-test-only

backend:
  stage: test
  <<: *test-rules
  script:
    - bash deploy/ci/scripts/backend.sh

backend-db:
  stage: test
  <<: [*test-rules, *mysql]
  # 시험 전부를 하나씩 + 진짜 DB 시험이라 김
  timeout: 90m
  variables:
    # 서비스 이름 mysql → 스크립트가 127.0.0.1:3306으로 이어 줌 (lib/db.sh)
    CI_DB_HOST: mysql
    CI_DB_PORT: "3306"
  script:
    - bash deploy/ci/scripts/backend-db.sh

frontend:
  stage: test
  <<: *test-rules
  script:
    - bash deploy/ci/scripts/frontend.sh

frontend-mobile:
  stage: test
  <<: *test-rules
  script:
    - bash deploy/ci/scripts/frontend-mobile.sh

docker:
  stage: build
  <<: *test-rules
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash
  script:
    - bash deploy/ci/scripts/docker-build.sh

# 브라우저 시험: Playwright 이미지(브라우저·의존 패키지 들어 있음, e2e/package-lock의 @playwright/test와 같은 판)
.e2e: &e2e
  stage: e2e
  <<: *mysql
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  timeout: 2h
  variables:
    CI_DB_HOST: mysql
    CI_DB_PORT: "3306"
    E2E_WORKERS: "2"
    E2E_INSTALL_BROWSERS: "0"
  artifacts:
    when: on_failure
    expire_in: 14 days
    paths:
      - e2e/reports/
      - e2e/test-results/
      - e2e/.runtime/backend.log

e2e-quick:
  <<: *e2e
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - bash deploy/ci/scripts/e2e.sh quick

e2e-full:
  <<: *e2e
  # 일정(매일 03:00 KST로 만들기)·손으로 실행 때만 (손으로는 E2E가 full일 때)
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || ($CI_PIPELINE_SOURCE == "web" && $E2E == "full")
  script:
    - bash deploy/ci/scripts/e2e.sh full

# Node 2개 브라우저 전체 (GitHub ci.yml e2e-multinode와 같은 일): 백엔드 둘 + 앞단 + Redis 서비스 (docs/배포_설정.md 7장)
# 일정(밤 03:00 KST)·손으로(Run pipeline에 E2E=multinode) 때만
# 앞단은 node(lb-proxy.js): Playwright 이미지엔 docker가 없고, dind 안 nginx는 일 컨테이너의 4101·4102를 못 부름 → nginx 규칙 확인은 GitHub 쪽·docker-build.sh nginx -t가 맡음
e2e-multinode:
  <<: *e2e
  timeout: 150m
  services:
    - name: mysql:8.4
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: ci-root-test-only
    - name: redis:7.4-alpine
      alias: redis
  variables:
    CI_DB_HOST: mysql
    CI_DB_PORT: "3306"
    E2E_WORKERS: "2"
    E2E_INSTALL_BROWSERS: "0"
    E2E_REDIS_URL: redis://redis:6379
    E2E_PROXY: node
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || ($CI_PIPELINE_SOURCE == "web" && $E2E == "multinode")
  artifacts:
    when: on_failure
    expire_in: 14 days
    paths:
      - e2e/reports/
      - e2e/test-results/
      - e2e/.runtime/backend-*.log
  script:
    - bash deploy/ci/scripts/e2e.sh multinode

audit:
  stage: security
  <<: *test-rules
  script:
    - bash deploy/ci/scripts/audit.sh

secrets:
  stage: security
  <<: *test-rules
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then export SECRET_SCAN_RANGE="$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA";
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "${CI_COMMIT_BEFORE_SHA//0/}" != "" ]; then export SECRET_SCAN_RANGE="$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"; fi
    - bash deploy/ci/scripts/secrets-scan.sh

# ---------- 배포 (CD) ----------
# 환경 고르기: 손으로 돌릴 때 변수 DEPLOY_ENV=staging|production (기본 staging, v* 태그는 production)
# 비밀값·환경값은 Settings → CI/CD → Variables (환경 범위·Protected·Masked) — 이름은 docs/CI_CD.md
.deploy-rules: &deploy-rules
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      variables: { DEPLOY_ENV: production }
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

deploy-build:
  stage: deploy
  <<: *deploy-rules
  interruptible: false
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  environment:
    name: ${DEPLOY_ENV}
    action: prepare
  before_script:
    - apk add --no-cache bash git
  script:
    # GitLab 레지스트리를 쓰면 IMAGE_REGISTRY=$CI_REGISTRY_IMAGE, 로그인은 CI_REGISTRY_USER/CI_REGISTRY_PASSWORD
    - export REGISTRY_USERNAME="${REGISTRY_USERNAME:-$CI_REGISTRY_USER}" REGISTRY_PASSWORD="${REGISTRY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
    - set -o pipefail
    - bash deploy/ci/scripts/deploy/build-push.sh | tee build.log
    - grep '^image_tag=' build.log | tail -1 | sed 's/^image_tag=/IMAGE_TAG=/' > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env

deploy:
  stage: deploy
  needs: [deploy-build]
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      variables: { DEPLOY_ENV: production }
    - if: $CI_PIPELINE_SOURCE == "web"
  resource_group: deploy-$DEPLOY_ENV
  environment:
    name: ${DEPLOY_ENV}
    url: $SMOKE_DESKTOP_URL
  script:
    - bash deploy/ci/scripts/deploy/ship.sh deploy "$IMAGE_TAG"
    - bash deploy/ci/scripts/deploy/smoke.sh

# 배포 실패면 자동으로 되돌리기, 성공 뒤엔 손으로(▶) — ROLLBACK_TAG 비우면 바로 전 태그
rollback-on-failure:
  stage: deploy
  needs: [deploy]
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      variables: { DEPLOY_ENV: production }
      when: on_failure
    - if: $CI_PIPELINE_SOURCE == "web"
      when: on_failure
  resource_group: deploy-$DEPLOY_ENV
  environment:
    name: ${DEPLOY_ENV}
    action: access
  script:
    - bash deploy/ci/scripts/deploy/ship.sh rollback "${ROLLBACK_TAG:-}"
    - bash deploy/ci/scripts/deploy/smoke.sh

rollback:
  stage: deploy
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
      variables: { DEPLOY_ENV: production }
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  needs: []
  resource_group: deploy-$DEPLOY_ENV
  environment:
    name: ${DEPLOY_ENV}
    action: access
  script:
    - bash deploy/ci/scripts/deploy/ship.sh rollback "${ROLLBACK_TAG:-}"
    - bash deploy/ci/scripts/deploy/smoke.sh
